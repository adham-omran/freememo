<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <title>FreeMemo</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light dark">

        <!-- Search snippet + social card. Kept in sync with index.prod.html so
             the two shells stay comparable; inert on localhost. -->
        <meta name="description" content="Turn PDFs, EPUBs, articles and video into flashcards for your own Anki, paced reading, and AI-graded quizzes. Open source, free during early access.">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="FreeMemo">
        <meta property="og:title" content="FreeMemo — read it once, remember it">
        <meta property="og:description" content="Turn PDFs, EPUBs, articles and video into flashcards for your own Anki, paced reading, and AI-graded quizzes. Open source, free during early access.">
        <meta property="og:url" content="https://freememo.net/">
        <meta property="og:image" content="https://freememo.net/freememo/landing-hero.png">
        <meta property="og:image:width" content="3840">
        <meta property="og:image:height" content="2400">
        <meta property="og:image:alt" content="FreeMemo showing a PDF page beside its extracted text, with generated basic and cloze flashcards below.">
        <meta name="twitter:card" content="summary_large_image">

        <!-- Google AdSense site verification. -->
        <meta name="google-adsense-account" content="ca-pub-2105898724643889">
        <!-- Open Sans, self-hosted (committed text; its woff2 files live in the
	     gitignored vendor tree). A <link> rather than index.css's old @import:
             an @import chained a second request behind our own stylesheet. -->
        <link rel="stylesheet" href="/freememo/open-sans.css">
        <link rel="stylesheet" href="/freememo/index.css" type="text/css" />
        <link rel="icon" type="image/svg+xml" href="/freememo/favicon.svg">
        <link rel="apple-touch-icon" sizes="180x180" href="/freememo/favicon.svg">

        <!-- ── Vendored third-party assets ──────────────────────────────────
             Everything below is served from /freememo/vendor/<lib>@<version>/,
             downloaded by `clj -X:build vendor/fetch!` (NOT in git) and
	     cached immutably.

             Only the libraries that MUST exist before the app boots are tagged
             here. pdf.js, Konva, graphology+sigma, wavesurfer+regions, lamejs
             and KaTeX carry no tag: freememo.vendor-libs injects them on demand,
             which keeps ~305 KB (gzip) of JS off the boot path.

             Keep this block byte-identical to index.prod.html's. -->

        <!-- Stylesheets for the on-demand libraries load eagerly anyway —
             together they are ~17 KB gzip, and deferring them would flash
             unstyled content the first time an editor or the viewer mounts. -->
        <link rel="stylesheet" href="/freememo/vendor/pdf.js@3.11.174/pdf_viewer.min.css">
        <link rel="stylesheet" href="/freememo/vendor/katex@0.16.11/katex.min.css">
        <!-- snow: card-field editors (quill_field). bubble: main doc editor. -->
        <link rel="stylesheet" href="/freememo/vendor/quill@2.0.3/quill.snow.css">
        <link rel="stylesheet" href="/freememo/vendor/quill@2.0.3/quill.bubble.css">

        <!-- highlight.js — required by the Quill 2 syntax module, which reads
             window.hljs when an editor is constructed. MUST precede quill.js.
             No theme CSS — freememo-anki.css + index.css own the palette. -->
        <script src="/freememo/vendor/highlight.js@11.9.0/highlight.min.js"></script>
        <!-- Clojure language pack (not in the common bundle). MUST follow highlight.min.js -->
        <script src="/freememo/vendor/highlight.js@11.9.0/languages/clojure.min.js"></script>

        <!-- Quill. Eager because quill_field's namespace-load `defonce` patches
             Quill's icon registry before any load guard could run. -->
        <script src="/freememo/vendor/quill@2.0.3/quill.js"></script>
        <!-- Drag-to-resize for image blots. MUST load after quill.js: the UMD
             wrapper reads window.Quill and self-registers `modules/resize`.
             Options live in freememo.quill-field/quill-config. No CSS link —
             the module's styles are ported into index.css so they theme with
             light-dark() like the rest of the app. -->
        <script src="/freememo/vendor/quill-resize-module@2.1.3/resize.js"></script>

        <script defer type="text/javascript" src="/freememo/js/shared.js"></script>
        <script defer type="text/javascript" src="/freememo/js/main.js"></script>
    </head>
    <body></body>
</html>
