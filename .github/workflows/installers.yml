# Builds the Local Install installers of a Release (ticket 17).
#
# The private Forgejo deploy pushes the tag v<Release Version> to this repository
# and makes a DRAFT release with notes (tools/release/create-draft.sh). This
# workflow runs on that tag. It builds the app jar once, builds an installer on
# each OS, attaches everything to the draft, and publishes the draft only when
# every asset is attached. Then it deletes older releases and tags
# (tools/release/prune.sh).
#
# The Release Version is the tag name, never computed here: the public tip can
# be an older commit than the private one when the newest commits touch only
# excluded paths (docs/adr/0002).
#
# A failed job leaves the release a draft and fails the run. The installers are
# not code signed yet (ticket 11). The app jar is signed (ticket 19): the release
# job signs it with the Ed25519 key in the secret APP_UPDATE_SIGNING_KEY and
# attaches freememo-<Release Version>-app.jar.sig. The matching public key is
# tools/installer/app-update-public-key.b64, which build.mjs bakes into each
# installer. Until that file exists App Update is off and the jar stays unsigned.
# Once it exists the release job refuses to publish without the signature.
# tools/installer/app-update-wizard.sh makes the key pair.
#
# Actions are pinned to full commit SHAs (the tag is in the comment). Every
# `${{ }}` value reaches a `run:` through `env:`, never inline. `brew install`
# in the macos job is not pinned: Homebrew has no simple version pin.
#
# Every file that this workflow uses is in a path that tools/publish-clean/EXCLUDED
# keeps: .github/, tools/release/, tools/installer/, src/, resources/, deps.edn.
name: installers

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

# A newer tag cancels the run in progress: only the newest release matters, and
# its commit holds every older change. One run at a time also keeps the publish
# and prune steps of two runs apart. The cancelled run's draft stays until the
# next prune.sh, which deletes every release but the one it keeps.
concurrency:
  group: installers
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad tag $tag"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The private deploy makes the draft before it pushes the tag. Without
      # the draft, every job would build and the release job would fail last.
      - name: Check that the draft release exists
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$draft" != "true" ]; then
            echo "::error::There is no draft release for the tag $GITHUB_REF_NAME. The private deploy makes the draft (tools/release/create-draft.sh) before it pushes the tag. Run the deploy again, or make the draft by hand."
            exit 1
          fi

  jar:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: 1.12.6.1673
      # The jar is AOT compiled once, on Linux: a case-insensitive disk (macOS)
      # cannot hold the classes of Electric (see src-build/build.clj).
      - name: Build the app jar
        env:
          JAVA_TOOL_OPTIONS: -Xmx4g
        run: |
          clojure -X:build vendor/fetch!
          clojure -J-Xss4m -X:build:prod uberjar :build/jar-name '"app.jar"' :build/aot true \
            :release-version "\"$VERSION\""
      # The release feed (ticket 18) reads the Runtime and the Sync Protocol of
      # this commit from this file. Only the commit itself knows them.
      - name: Write the release data
        run: |
          version="$VERSION"
          mkdir -p meta
          sha=$(sha256sum target/app.jar | cut -d' ' -f1)
          clojure -M -e "(require 'cheshire.core 'freememo.desktop-version) (println (cheshire.core/generate-string {:release_version \"$version\" :runtime freememo.desktop-version/runtime :sync_protocol freememo.desktop-version/sync-protocol :app_jar_sha256 \"$sha\"}))" > "meta/$(tools/release/asset-names.sh "$version" release)"
          cat meta/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          path: target/app.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-json
          path: meta/*.json
          if-no-files-found: error

  linux:
    needs: [version, jar]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: jar
      - name: Build the .deb
        run: node tools/installer/build.mjs --version "$VERSION" --jar jar/app.jar --type deb --out out
      # The check installs the package, as a user does, and starts it headless.
      - name: Install the .deb and wait for READY
        # The runner has no desktop, so it lacks /usr/share/desktop-directories, and the
        # xdg-desktop-menu call in jpackage's postinst exits 3. A desktop Linux has it.
        run: |
          sudo mkdir -p /usr/share/desktop-directories
          sudo apt-get update
          sudo apt-get install -y "./out/$(tools/release/asset-names.sh "$VERSION" linux)"
          tools/installer/smoke.sh /opt/freememo/bin/FreeMemo 300
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: |
            out/*.deb
            out/*.jar
          if-no-files-found: error

  macos:
    needs: [version, jar]
    runs-on: macos-15   # arm64. GitHub retired macos-14.
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: jar
      - name: Install the tools that the installer bundles
        run: brew install imagemagick graphviz dylibbundler
      - name: Build the .dmg
        run: node tools/installer/build.mjs --version "$VERSION" --jar jar/app.jar --type dmg --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-macos
          path: out/*.dmg
          if-no-files-found: error

  windows:
    needs: [version, jar]
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-jar
          path: jar
      # jpackage needs the WiX Toolset on PATH to make an .msi.
      - name: Put WiX on PATH
        run: |
          if ! command -v candle.exe >/dev/null 2>&1; then
            choco install wixtoolset --no-progress -y
          fi
          echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
      - name: Build the .msi
        run: node tools/installer/build.mjs --version "$VERSION" --jar jar/app.jar --type msi --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: out/*.msi
          if-no-files-found: error

  release:
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      # The signature covers a short text, not the jar bytes (see
      # src/freememo/app_update.clj): "freememo-app-jar", the version and the SHA-256 of the jar.
      - name: Sign the app jar
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: |
          pub=tools/installer/app-update-public-key.b64
          if [ -z "$APP_UPDATE_SIGNING_KEY" ]; then
            if [ -s "$pub" ]; then
              echo "The public key $pub exists, but the secret APP_UPDATE_SIGNING_KEY is empty. Refusing to publish an unsigned app jar."
              exit 1
            fi
            echo "App Update is off: there is no public key and no signing secret yet."
            exit 0
          fi
          key="$RUNNER_TEMP/app-update-key.pem"
          (umask 077; printf '%s\n' "$APP_UPDATE_SIGNING_KEY" > "$key")
          jar="assets/$(tools/release/asset-names.sh "$VERSION" app)"
          sig="assets/$(tools/release/asset-names.sh "$VERSION" sig)"
          printf 'freememo-app-jar\n%s\n%s\n' "$VERSION" "$(sha256sum "$jar" | cut -d' ' -f1)" > statement.txt
          openssl pkeyutl -sign -rawin -inkey "$key" -in statement.txt -out "$sig"
          if [ -s "$pub" ]; then
            openssl pkey -in "$key" -pubout -outform DER | base64 -w0 > derived.b64
            if [ "$(tr -d '[:space:]' < "$pub")" != "$(cat derived.b64)" ]; then
              echo "The secret does not match $pub."; rm -f "$key"; exit 1
            fi
          fi
          rm -f "$key"
          echo "signed $sig"
      # attach.txt lists what goes on the release: every required asset (the run
      # fails when one is missing) and each optional asset that exists (the .sig).
      - name: Check that every asset exists
        run: |
          missing=0
          : > attach.txt
          for name in $(tools/release/asset-names.sh "$VERSION"); do
            if [ -s "assets/$name" ]; then echo "found $name"; echo "$name" >> attach.txt; else echo "MISSING $name"; missing=1; fi
          done
          for name in $(tools/release/asset-names.sh "$VERSION" --optional); do
            if [ -s "assets/$name" ]; then echo "found $name"; echo "$name" >> attach.txt; fi
          done
          [ "$missing" = 0 ]
      - name: Attach the assets to the draft
        run: |
          gh release view "v$VERSION" --json isDraft --jq .isDraft
          for name in $(cat attach.txt); do
            gh release upload "v$VERSION" "assets/$name" --clobber
          done
      # The draft stays a draft unless the release itself lists every asset.
      - name: Check the draft lists every asset
        run: |
          gh release view "v$VERSION" --json assets --jq '.assets[].name' | sort > attached.txt
          sort attach.txt > expected.txt
          cat attached.txt
          comm -13 attached.txt expected.txt > absent.txt
          if [ -s absent.txt ]; then echo "not attached:"; cat absent.txt; exit 1; fi
      - name: Publish the release
        run: gh release edit "v$VERSION" --draft=false
      - name: Delete older releases and tags
        run: tools/release/prune.sh "$VERSION"
